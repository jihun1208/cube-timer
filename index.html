<!DOCTYPE html>
<html lang="zxx">
  <head>
    <meta charset="UTF-8" />
    <title>Cube Timer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize.css/8.0.1/normalize.min.css" />
  </head>
  <link rel="stylesheet" href="style.css" />
  <body>
    <header>
      <h1>Cube Timer</h1>
    </header>

    <div class="scramble">
      <span id="scramble"></span>
    </div>

    <div class="timer" id="timer">
      <span id="min">00</span>:<span id="sec">00</span>.<span id="mil">00</span>
    </div>

    <div class="result">
      <table class="resultTable" id="resultTable">
        <tr>
          <th id="idx">#</th>
          <th>Results</th>
          <th>Ao5</th>
        </tr>
      </table>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
